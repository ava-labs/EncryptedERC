name: "CI"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    strategy:
      matrix:
        node-version: [18.x]
        go-version: ["1.22"]

    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out the repo"
        uses: "actions/checkout@v4"

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"

      - name: "Install the dependencies"
        run: "npm install"

      - name: Hardhat coverage
        run: |
          npx hardhat coverage

      - name: "Run linter"
        run: "npm run lint"

      - name: "Check verification keys"
        # Fails if any Groth16 key has delta == gamma (trapdoor delta = 1, forgeable for any
        # statement), or if a production key's IC commitments no longer match the circuits.
        run: "npm run check:verifiers"
